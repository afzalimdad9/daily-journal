name: Android Build

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-build.yml"
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required" >&2; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CONTENT_API_URL: ${{ vars.CONTENT_API_URL }}
          ADMOB_ANDROID_BANNER_UNIT_ID: ${{ vars.ADMOB_ANDROID_BANNER_UNIT_ID }}
          ADMOB_ANDROID_NATIVE_UNIT_ID: ${{ vars.ADMOB_ANDROID_NATIVE_UNIT_ID }}
          ADMOB_ANDROID_INTERSTITIAL_UNIT_ID: ${{ vars.ADMOB_ANDROID_INTERSTITIAL_UNIT_ID }}
          ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" -a -n "$ANDROID_KEY_ALIAS" -a -n "$ANDROID_KEY_PASSWORD" || { echo "Android signing secrets are required" >&2; exit 1; }
          gradle --no-daemon -p apps/android assembleRelease bundleRelease \
            -PcontentApiUrl="${CONTENT_API_URL:-https://example.com/api/}" \
            -PadBannerUnitId="${ADMOB_ANDROID_BANNER_UNIT_ID:-ca-app-pub-3940256099942544/6300978111}" \
            -PadNativeUnitId="${ADMOB_ANDROID_NATIVE_UNIT_ID:-ca-app-pub-3940256099942544/2247696110}" \
            -PadInterstitialUnitId="${ADMOB_ANDROID_INTERSTITIAL_UNIT_ID:-ca-app-pub-3940256099942544/1033173712}" \
            -PadMobAppId="${ADMOB_ANDROID_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
